<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* If someone lands on /index.html — typed, bookmarked, or from history —
   quietly rewrite the address bar to the clean folder URL. No reload,
   no redirect round-trip, and the page state is untouched. */
(function () {
  try {
    var p = location.pathname;
    if (/\/index\.html$/i.test(p)) {
      history.replaceState(null, '', p.slice(0, -10) + location.search + location.hash);
    }
  } catch (e) { /* older browsers just keep the long URL */ }
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio, journey and selected work.">
<meta name="theme-color" content="#F4F3EF">
<meta property="og:type" content="website">
<meta property="og:title" content="Portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=12">
</head>
<body data-page="home" data-root="">

<a class="skip-link" href="#main">Skip to content</a>

<header class="nav" id="nav">
  <div class="shell nav__inner">
        <a class="nav__brand" id="brand" href="./">Portfolio</a>
    <div class="nav__right">
      <nav class="nav__links" id="navLinks">
        <a href="#journey">Journey</a>
        <a href="#work">Work</a>
        <a href="projects.html">Projects</a>
        <a href="#skills">Skills</a>
        <a class="btn btn--primary btn--sm" href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>
      <button class="nav__toggle" id="navToggle" aria-label="Menu" aria-expanded="false"></button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero">
    <span class="hero__wash hero__wash--a" aria-hidden="true"></span>
    <span class="hero__wash hero__wash--b" aria-hidden="true"></span>
    <div class="shell">
      <div class="hero__grid">
        <div>
          <span class="pill" id="heroBadge"></span>
          <h1 id="heroHeadline" style="margin-top:1.25rem"></h1>
          <p class="lede" id="heroLede" style="margin-top:1.25rem"></p>
          <div class="hero__actions" id="heroActions"></div>
        </div>
        <div class="portrait" id="portrait"></div>
      </div>
    </div>
  </section>

  <section class="band band--lav roadmap" id="journey">
    <div class="shell">
      <div class="band__head reveal">
        <p class="eyebrow">Education and roles on one rail</p>
        <h2>Journey roadmap</h2>
      </div>
    </div>
    <div class="shell">
      <div class="snake" id="roadmapWrap">
        <div class="snake__grid snake__row--top" id="snakeTop"></div>
        <div class="snake__rail" id="snakeRail"></div>
        <div class="snake__grid snake__row--bottom" id="snakeBottom"></div>
        <div class="snake__vertical" id="snakeVertical"></div>
      </div>
    </div>
  </section>

  <section class="band band--cream" id="work">
    <div class="shell">
      <div class="band__head reveal">
        <h2>Experience</h2>
      </div>
      <div class="grid grid--2 stagger" id="jobsGrid"></div>
    </div>
  </section>

  <section class="band band--card" id="education">
    <div class="shell">
      <div class="band__head reveal">
        <h2>Education</h2>
      </div>
      <div class="grid grid--2 stagger" id="eduGrid"></div>
    </div>
  </section>

  <section class="band band--cream" id="projects">
    <div class="shell">
      <div class="band__head band__head--split reveal">
        <div>
          <p class="eyebrow">Things I have built</p>
          <h2>Featured projects</h2>
        </div>
        <a class="textlink" href="projects.html">All projects
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
          </svg>
        </a>
      </div>
      <div class="grid grid--3 stagger" id="projectsGrid"></div>
    </div>
  </section>

  <section class="band band--lav" id="certificates">
    <div class="shell">
      <div class="band__head reveal">
        <h2>Certificates</h2>
      </div>
      <div class="grid grid--3 stagger" id="certGrid"></div>
    </div>
  </section>

  <section class="band band--card" id="skills">
    <div class="shell">
      <div class="band__head reveal">
        <h2>Skills</h2>
      </div>
      <div id="skillsWrap"></div>
      <p class="skills__key" id="skillsKey"></p>
    </div>
  </section>

  <section class="band contact" id="contact">
    <span class="hero__wash hero__wash--b" aria-hidden="true" style="left:auto;right:-140px;bottom:-200px"></span>
    <div class="shell">
      <div class="contact__grid">
        <div class="reveal">
          <p class="eyebrow">Contact</p>
          <h2 id="contactHeading"></h2>
          <p class="lede" id="contactBlurb" style="margin-top:1rem"></p>
          <div class="contact__direct" id="contactDirect"></div>
        </div>
        <div class="contact__card reveal">
          <p style="font-size:1.0625rem;color:var(--ink);margin:0">Reach out via email or LinkedIn.</p>
          <div class="contact__actions" id="contactActions"></div>
          <p class="contact__fallback" id="contactFallback"></p>

          <form class="form hide" id="contactForm" novalidate>
            <div class="field">
              <label for="cName">Your name</label>
              <input type="text" id="cName" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="cEmail">Email</label>
              <input type="email" id="cEmail" name="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="cMessage">Message</label>
              <textarea id="cMessage" name="message" required></textarea>
            </div>
            <button class="btn btn--primary" id="formSubmit" type="submit">Send message</button>
            <p class="form__note" id="formNote"></p>
            <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="shell footer__inner">
    <span class="footer__copy">&copy; <span id="footYear"></span> <span id="footName"></span></span>
    <div class="social" id="social"></div>
  </div>
</footer>

<script src="site.js?v=12"></script>
</body>
</html>

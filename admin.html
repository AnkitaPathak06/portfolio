<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f4ee; color: #201f1d; font-family: 'Lora', Georgia, serif; font-size: 14px; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', Georgia, serif; margin: 0; letter-spacing: -0.02em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .bar { display: flex; align-items: center; gap: 18px; padding: 16px 26px; background: #2f5d57; color: #f7f4ee; position: sticky; top: 0; z-index: 20; }
  .bar h1 { font-size: 19px; font-weight: 600; margin-right: auto; }
  .bar .status { font-size: 12px; color: rgba(247,244,238,0.75); }
  .tabs { display: flex; gap: 4px; padding: 0 26px; border-bottom: 1px solid rgba(47,93,87,0.26); background: #f2eee5; position: sticky; top: 56px; z-index: 19; }
  .tabs button { background: none; border: 0; padding: 13px 16px; cursor: pointer; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: rgba(32,31,29,0.6); border-bottom: 2px solid transparent; }
  .tabs button.on { color: #201f1d; border-bottom-color: #b68235; }
  main { max-width: 1080px; margin: 0 auto; padding: 26px; }
  .panel { display: none; }
  .panel.on { display: block; }
  .card { border: 1px solid rgba(47,93,87,0.26); border-radius: 4px; background: rgba(255,255,255,0.5); margin-bottom: 14px; }
  .card > header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid rgba(47,93,87,0.16); }
  .card > header h3 { font-size: 17px; font-weight: 600; margin-right: auto; }
  .card .body { padding: 14px; display: none; }
  .card.open .body { display: block; }
  .grip { cursor: grab; color: rgba(32,31,29,0.4); user-select: none; }
  label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(32,31,29,0.55); margin: 12px 0 5px; }
  input[type=text], input[type=url], input[type=email], input[type=number], textarea, select {
    width: 100%; padding: 8px 10px; border: 1px solid rgba(47,93,87,0.3); border-radius: 4px; background: #fffdf9; }
  textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
  .row { display: grid; gap: 12px; }
  .row.c2 { grid-template-columns: 1fr 1fr; }
  .row.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .row.c4 { grid-template-columns: 90px 1fr 1fr 1fr; }
  .btn { cursor: pointer; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 4px; border: 1px solid rgba(47,93,87,0.4); background: transparent; }
  .btn:hover { background: rgba(182,130,53,0.1); }
  .btn.primary { background: #2f5d57; border-color: #2f5d57; color: #f7f4ee; }
  .btn.gold { background: #b68235; border-color: #b68235; color: #21170a; }
  .btn.danger { border-color: #8a3b2f; color: #8a3b2f; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 22px; }
  .item { border: 1px solid rgba(47,93,87,0.2); border-radius: 4px; padding: 12px; margin-bottom: 10px; background: #fffdf9; }
  .item .top { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .item .top strong { margin-right: auto; font-weight: 600; }
  .hint { font-size: 12px; color: rgba(32,31,29,0.6); line-height: 1.6; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 34px; height: 34px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
  .swatches button.on { border-color: #201f1d; }
  .toggle { display: flex; align-items: center; gap: 9px; margin-top: 10px; font-size: 13px; }
  .drop { border: 1px dashed rgba(47,93,87,0.4); border-radius: 4px; padding: 16px; text-align: center; font-size: 12px; color: rgba(32,31,29,0.6); cursor: pointer; }
  .drop.hot { background: rgba(182,130,53,0.1); border-color: #b68235; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .thumb { position: relative; width: 96px; }
  .thumb img { width: 96px; height: 60px; object-fit: cover; border: 1px solid rgba(47,93,87,0.3); }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border: 0; border-radius: 2px; background: rgba(32,31,29,0.75); color: #fff; cursor: pointer; font-size: 12px; line-height: 1; }
  .gate { max-width: 340px; margin: 90px auto; text-align: center; }
  .log { font-size: 12px; white-space: pre-wrap; background: #fffdf9; border: 1px solid rgba(47,93,87,0.25); border-radius: 4px; padding: 12px; max-height: 190px; overflow: auto; margin-top: 12px; }
  .warn { border-left: 2px solid #b68235; padding-left: 12px; font-size: 12.5px; line-height: 1.65; color: rgba(32,31,29,0.75); }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1 style="font-size:30px;font-weight:400;margin-bottom:10px">Admin</h1>
  <p class="hint" style="margin-bottom:16px">Enter the passcode.</p>
  <input type="password" id="pass" placeholder="Passcode">
  <button class="btn primary" style="margin-top:10px;width:100%" onclick="tryGate()">Unlock</button>
  <p class="hint" style="margin-top:14px">This is a deterrent, not security — anything in a public repo is readable. Never store secrets here.</p>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <h1>Portfolio admin</h1>
    <span class="status" id="status">loading…</span>
    <button class="btn small" onclick="preview()">Preview site</button>
    <button class="btn small gold" onclick="publish()">Publish to GitHub</button>
  </div>
  <div class="tabs">
    <button class="on" data-tab="sections">Sections</button>
    <button data-tab="projects">Projects</button>
    <button data-tab="appearance">Appearance</button>
    <button data-tab="details">Details</button>
    <button data-tab="publish">Publish</button>
  </div>
  <main>
    <div class="panel on" id="p-sections"></div>
    <div class="panel" id="p-projects"></div>
    <div class="panel" id="p-appearance"></div>
    <div class="panel" id="p-details"></div>
    <div class="panel" id="p-publish"></div>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>

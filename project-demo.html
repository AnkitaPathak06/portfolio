<body>
<div class="progress"></div>
<div id="root"></div>
<script src="render.js?v=mthmwpkp"></script>
<script>
/* Preview only: stands in a sample slide so the deck section can be seen locally.
   The live page renders the real PowerPoint in the same frame. */
Portfolio.loadContent()
  .then(c => {
    const p = c.projects[0];
    p.deckRatio = "4:3";
    p.slides = ["../uploads/sample-slide.png"];
    p.deckAbout = "Dummy copy, replace later. The deck was built for the mid-project review: it sets out where fraudulent claims were actually being caught, what the model changed about that, and the two decisions the panel needed to make on the day.";

    window.PF_SLUG = p.slug;
    Portfolio.renderProject(c, document.getElementById('root'));
  })
  .catch(e => { document.getElementById('root').innerHTML = '<p style="padding:40px;font-family:Georgia,serif">Could not load content.json — ' + e.message + '</p>'; });
</script>
</body>
</html>
